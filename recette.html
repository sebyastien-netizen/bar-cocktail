<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recette — Bar de Seb</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0d0d1a; color: #e8d5a8; min-height: 100vh; padding: 24px 16px 60px; }
    .logo { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
    .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: #c8a96e; }
    .logo-text { font-size: 13px; font-weight: 500; color: #c8a96e; letter-spacing: 0.08em; }
    .card { background: rgba(200,169,110,0.06); border: 0.5px solid rgba(200,169,110,0.2); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
    .photo { width: 100%; height: 220px; object-fit: cover; border-radius: 14px; margin-bottom: 16px; }
    .titre { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .meta-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .tag { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: rgba(255,255,255,0.06); color: rgba(232,213,168,0.7); border: 0.5px solid rgba(255,255,255,0.1); }
    .tag-gout { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: rgba(200,169,110,0.12); color: #c8a96e; border: 0.5px solid rgba(200,169,110,0.25); margin-right: 6px; }
    .description { font-size: 14px; color: rgba(232,213,168,0.75); line-height: 1.5; margin-top: 8px; }
    .section-titre { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: rgba(232,213,168,0.5); text-transform: uppercase; margin-bottom: 12px; }
    .ing-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 0.5px solid rgba(255,255,255,0.08); font-size: 14.5px; }
    .ing-row:last-child { border-bottom: none; }
    .ing-dose { font-weight: 600; color: #c8a96e; }
    .etape-row { display: flex; gap: 12px; padding: 10px 0; border-bottom: 0.5px solid rgba(255,255,255,0.08); }
    .etape-row:last-child { border-bottom: none; }
    .etape-num { width: 24px; height: 24px; border-radius: 50%; background: rgba(200,169,110,0.15); color: #c8a96e; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .etape-texte { font-size: 14.5px; line-height: 1.5; padding-top: 2px; }
    .profil-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; }
    .barre-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .barre-label { font-size: 12px; width: 52px; color: rgba(232,213,168,0.6); flex-shrink: 0; }
    .barre-track { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
    .barre-fill { height: 100%; background: #c8a96e; border-radius: 3px; }
    .barre-val { font-size: 11px; color: rgba(232,213,168,0.4); width: 22px; text-align: right; flex-shrink: 0; }
    .btn { width: 100%; background: #c8a96e; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 600; color: #1a1206; cursor: pointer; margin-top: 8px; }
    .footer-credit { text-align: center; font-size: 12px; color: rgba(232,213,168,0.35); margin-top: 28px; }
    .loading, .erreur { text-align: center; padding: 60px 20px; color: rgba(232,213,168,0.5); font-size: 14px; }
    .anecdote { font-size: 13.5px; font-style: italic; color: rgba(232,213,168,0.6); line-height: 1.5; }
  </style>
</head>
<body>

<div class="logo"><div class="logo-dot"></div><div class="logo-text">BAR DE SEB</div></div>

<div id="contenu">
  <div class="loading">Chargement de la recette…</div>
</div>

<script>
const SUPABASE_URL = 'https://wqsprjlocuhandhvpytx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_g4pDtkemUi-6VUG6qgVJWw_PAy5YibN';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function renderBarre(label, valeur) {
  if (!valeur) return '';
  const pct = Math.round((valeur / 5) * 100);
  return `
    <div class="barre-row">
      <span class="barre-label">${label}</span>
      <div class="barre-track"><div class="barre-fill" style="width:${pct}%"></div></div>
      <span class="barre-val">${valeur}/5</span>
    </div>
  `;
}

function hasProfil(r) {
  return r.gout_sucre || r.gout_amer || r.gout_acide || r.gout_fruite || r.gout_fume || r.gout_floral || r.gout_epice || r.gout_cremeux;
}

function renderMateriel(m) {
  const icones = {
    'shaker': '<svg width="26" height="26" viewBox="0 0 28 28" fill="none"><path d="M9 4h10M9 4v6h10V4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 10l1 14h8l1-14" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="9" y1="14" x2="19" y2="14" stroke="currentColor" stroke-width="0.8" stroke-dasharray="1.5 1.5"/></svg>',
    'verre à mélange': '<svg width="26" height="26" viewBox="0 0 28 28" fill="none"><path d="M8 4h12M8 4v18q0 3 6 3t6-3V4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="11" x2="20" y2="11" stroke="currentColor" stroke-width="0.8" stroke-dasharray="1.5 1.5"/><line x1="20" y1="15" x2="24" y2="15" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>',
    'verre old fashioned': '<svg width="26" height="26" viewBox="0 0 28 28" fill="none"><path d="M6 6h16L19 22H9L6 6z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="6" y1="6" x2="22" y2="6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>',
    'verre à martini': '<svg width="26" height="26" viewBox="0 0 28 28" fill="none"><path d="M5 6l9 10 9-10H5z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="14" y1="16" x2="14" y2="24" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="10" y1="24" x2="18" y2="24" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>',
    'coupette': '<svg width="26" height="26" viewBox="0 0 28 28" fill="none"><path d="M5 7 Q14 18 23 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" fill="none"/><line x1="5" y1="7" x2="23" y2="7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="14" y1="17" x2="14" y2="24" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="10" y1="24" x2="18" y2="24" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>',
    'highball': '<svg width="26" height="26" viewBox="0 0 28 28" fill="none"><path d="M9 4h10v20H9z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="9" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="0.8" stroke-dasharray="1.5 1.5"/></svg>',
    'passoire julep': '<svg width="26" height="26" viewBox="0 0 28 28" fill="none"><path d="M4 12 Q4 21 14 21 Q24 21 24 12Z" stroke="currentColor" stroke-width="1.2" fill="none"/><line x1="4" y1="12" x2="24" y2="12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="14" y1="21" x2="14" y2="26" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="10" cy="16" r="1" fill="currentColor"/><circle cx="14" cy="17.5" r="1" fill="currentColor"/><circle cx="18" cy="16" r="1" fill="currentColor"/></svg>',
    'passoire fine': '<svg width="26" height="26" viewBox="0 0 28 28" fill="none"><path d="M4 12 Q4 21 14 21 Q24 21 24 12Z" stroke="currentColor" stroke-width="1.2" fill="none"/><line x1="4" y1="12" x2="24" y2="12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><line x1="14" y1="21" x2="14" y2="26" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="9" cy="15" r="0.7" fill="currentColor"/><circle cx="12" cy="17" r="0.7" fill="currentColor"/><circle cx="15" cy="17.5" r="0.7" fill="currentColor"/><circle cx="18" cy="17" r="0.7" fill="currentColor"/><circle cx="21" cy="15" r="0.7" fill="currentColor"/></svg>',
    'cuillère de bar': '<svg width="26" height="26" viewBox="0 0 28 28" fill="none"><line x1="14" y1="25" x2="14" y2="13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><ellipse cx="14" cy="10" rx="3.5" ry="2.5" stroke="currentColor" stroke-width="1.2" fill="none"/><line x1="14" y1="7.5" x2="14" y2="4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>',
    'jigger': '<svg width="26" height="26" viewBox="0 0 28 28" fill="none"><path d="M10 14h8M10 14l-2-8h12l-2 8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 14l-1 6h10l-1-6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    'pilon': '<svg width="26" height="26" viewBox="0 0 28 28" fill="none"><rect x="11" y="4" width="6" height="14" rx="3" stroke="currentColor" stroke-width="1.2"/><ellipse cx="14" cy="20" rx="5" ry="3" stroke="currentColor" stroke-width="1.2"/></svg>',
    'blender': '<svg width="26" height="26" viewBox="0 0 28 28" fill="none"><path d="M9 6h10l-2 14H11L9 6z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="9" y1="6" x2="19" y2="6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><rect x="10" y="20" width="8" height="4" rx="1" stroke="currentColor" stroke-width="1.2"/></svg>',
  };
  const desc = {
    'shaker': 'Shake vigoureusement avec glace',
    'verre à mélange': 'Pour stirrer sans diluer trop vite',
    'verre old fashioned': 'Service sur glaçon unique',
    'verre à martini': 'Service sans glace, bien froid',
    'coupette': 'Service sans glace, élégant',
    'highball': 'Grand verre pour long drinks',
    'passoire julep': 'Filtration depuis le verre à mélange',
    'passoire fine': 'Double filtration pour un résultat limpide',
    'cuillère de bar': 'Stirrer 30–45 secondes',
    'jigger': 'Mesure précise des doses',
    'pilon': 'Écraser herbes et agrumes délicatement',
    'blender': 'Cocktails frozen, glace pilée',
  };
  const key = (m.nom || '').toLowerCase();
  const svg = Object.entries(icones).find(([k]) => key.includes(k))?.[1]
    || '<svg width="26" height="26" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="8" stroke="currentColor" stroke-width="1.2"/><line x1="14" y1="10" x2="14" y2="14" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="14" cy="17" r="1" fill="currentColor"/></svg>';
  const description = Object.entries(desc).find(([k]) => key.includes(k))?.[1] || '';
  return `
    <div style="display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.03);border:0.5px solid rgba(255,255,255,0.08)">
      <div style="flex-shrink:0;opacity:0.75;color:#c8a96e">${svg}</div>
      <div>
        <div style="font-size:14px;font-weight:600">${m.nom}${m.essentiel === false ? ' <span style="font-size:11px;color:rgba(232,213,168,0.4);font-weight:400">optionnel</span>' : ''}</div>
        ${description ? `<div style="font-size:12px;color:rgba(232,213,168,0.5)">${description}</div>` : ''}
      </div>
    </div>`;
}

async function chargerRecette() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const zone = document.getElementById('contenu');

  if (!id) {
    zone.innerHTML = '<div class="erreur">Lien invalide — identifiant de recette manquant.</div>';
    return;
  }

  const [{ data: recette }, { data: ingredients }, { data: etapes }, { data: materiels }] = await Promise.all([
    db.from('recettes').select('*').eq('id', id).single(),
    db.from('recette_ingredients').select('*').eq('recette_id', id).order('ordre'),
    db.from('recette_etapes').select('*').eq('recette_id', id).order('ordre'),
    db.from('recette_materiels').select('*').eq('recette_id', id)
  ]);

  if (!recette) {
    zone.innerHTML = '<div class="erreur">🍸 Cette recette est introuvable ou a été supprimée.</div>';
    return;
  }

  document.title = recette.nom + ' — Bar de Seb';

  zone.innerHTML = `
    ${recette.photo_url ? `<img class="photo" src="${recette.photo_url}" alt="${recette.nom}">` : ''}
    <div class="titre">${recette.nom}</div>
    <div class="meta-row">
      ${recette.difficulte ? `<span class="tag">${recette.difficulte}</span>` : ''}
      ${recette.base_alcool ? `<span class="tag">🍶 ${recette.base_alcool}</span>` : ''}
      ${recette.verre_type ? `<span class="tag">🥃 ${recette.verre_type}</span>` : ''}
    </div>
    ${recette.gouts && recette.gouts.length ? `<div class="meta-row">${recette.gouts.map(g => `<span class="tag-gout">${g}</span>`).join('')}</div>` : ''}
    ${recette.description_courte ? `<div class="description">${recette.description_courte}</div>` : ''}

    ${materiels && materiels.length ? `
    <div class="card">
      <div class="section-titre">Matériels nécessaires</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        ${materiels.map(m => renderMateriel(m)).join('')}
      </div>
    </div>` : ''}

    ${ingredients && ingredients.length ? `
    <div class="card">
      <div class="section-titre">Ingrédients — 1 verre</div>
      ${ingredients.map(ing => `
        <div class="ing-row">
          <span>${ing.nom}${ing.optionnel ? ' (optionnel)' : ''}</span>
          ${ing.quantite ? `<span class="ing-dose">${ing.quantite}${ing.unite ? ' ' + ing.unite : ''}</span>` : ''}
        </div>
      `).join('')}
      ${recette.garniture ? `<div class="ing-row"><span>Garniture</span><span class="ing-dose">${recette.garniture}</span></div>` : ''}
    </div>` : ''}

    ${etapes && etapes.length ? `
    <div class="card">
      <div class="section-titre">Préparation</div>
      ${etapes.map((e, i) => `
        <div class="etape-row">
          <div class="etape-num">${i + 1}</div>
          <div class="etape-texte"><strong>${e.titre ? e.titre + ' — ' : ''}</strong>${e.description || ''}</div>
        </div>
      `).join('')}
    </div>` : ''}

    ${hasProfil(recette) ? `
    <div class="card">
      <div class="section-titre">Profil gustatif</div>
      <div class="profil-grid">
        <div>
          ${renderBarre('Sucré', recette.gout_sucre)}
          ${renderBarre('Amer', recette.gout_amer)}
          ${renderBarre('Acide', recette.gout_acide)}
          ${renderBarre('Fruité', recette.gout_fruite)}
        </div>
        <div>
          ${renderBarre('Fumé', recette.gout_fume)}
          ${renderBarre('Floral', recette.gout_floral)}
          ${renderBarre('Épicé', recette.gout_epice)}
          ${renderBarre('Crémeux', recette.gout_cremeux)}
        </div>
      </div>
    </div>` : ''}

    ${recette.degustation_defi ? `
    <div class="card">
      <div class="section-titre">🎯 Défi dégustation</div>
      <div class="description">${recette.degustation_defi}</div>
    </div>` : ''}

    ${recette.anecdote ? `
    <div class="card">
      <div class="section-titre">Histoire</div>
      <div class="anecdote">${recette.anecdote}</div>
    </div>` : ''}

    <button class="btn" onclick="partager('${recette.nom.replace(/'/g, "\\'")}')">🔗 Partager cette recette</button>

    <div class="footer-credit">🍸 Bar à Cocktail de Seb</div>
  `;
}

async function partager(nom) {
  const url = window.location.href;
  if (navigator.share) {
    try { await navigator.share({ title: nom, url }); }
    catch (e) { /* annulé par l'utilisateur, rien à faire */ }
  } else {
    await navigator.clipboard.writeText(url);
    alert('Lien copié !');
  }
}

chargerRecette();
</script>

</body>
</html>
